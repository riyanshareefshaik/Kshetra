<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1b5e20" />
    <meta name="description" content="Kshetra: your field's history from space, why yields changed, and what to grow next." />
    <title>Kshetra</title>
    <script>
      // Set the theme before first paint so night mode never flashes white.
      try {
        var k = localStorage.getItem("kshetra.theme") || "system";
        var dark = k === "dark" || (k === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) { document.documentElement.dataset.theme = "light"; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
